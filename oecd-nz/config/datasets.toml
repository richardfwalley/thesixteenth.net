# One table per job. Fill in the dataflow you want and the NZ series that replaces
# the hole in it; nothing else in the pipeline needs to change.
#
# Finding the OECD ids: open the series in the OECD Data Explorer, then use the
# "Developer API" panel — it prints agency, dataflow, version and the dotted key.
#
# The [*.basis] blocks are not decoration. Where the two sides were surveyed
# differently, splice() warns and writes the difference into the footnote, because
# no arithmetic can repair a definitional gap.

[dataset.business-innovation]
title = "OECD business innovation indicators, with New Zealand spliced in"
link = "none"          # no NZ rows in the OECD flow to anchor on, so nothing to chain
overwrite = false
strict_units = true
notes = """
OECD side: Business innovation statistics and indicators (BISI), compiled from national
innovation surveys. The April 2026 release covers 2020-2022 for 33 OECD members plus 7
partner/accession economies — NZ is not among the reporting countries.
NZ side: Stats NZ Business Operations Survey (BOS), Module 1 innovation questions.

UNVERIFIED — both hosts are blocked by this sandbox's egress policy, so every id and
every basis value below is a placeholder to confirm against the source metadata before
any number is published. See docs/business-innovation.md.
"""

  [dataset.business-innovation.oecd]
  agency = "TODO"                      # e.g. OECD.STI.PIE / OECD.STI.STP — confirm in Developer API
  dataflow = "TODO_CONFIRM@DF_TODO"    # full DSD_CODE@DATAFLOW_CODE
  version = "1.0"
  key = ""                             # dotted dimension filter once the indicator is chosen
  start_period = "2010"

    [dataset.business-innovation.oecd.basis]
    survey = "National innovation surveys (CIS-type)"
    manual = "Oslo Manual 2018"
    reference_period_years = 3         # CONFIRM against the BISI metadata
    size_threshold = 10                # CONFIRM
    industry_scope = "CONFIRM — core CIS industry coverage"
    population = "CONFIRM"

  [dataset.business-innovation.source]
  name = "Stats NZ"
  path = "data/raw/bos-2023-innovation.csv"   # hand-downloaded from the BOS 2023 release
  area = "NZL"
  series = "Business Operations Survey 2023, Module 1: innovation"
  notes = """
BOS 2023 replaced the three separate questions on operational, organisational and
marketing process innovation with a single process-innovation question, so the 2023
process-innovation figure is not on the same footing as earlier BOS rounds.
"""

    [dataset.business-innovation.source.basis]
    survey = "Business Operations Survey"
    manual = "CONFIRM — which Oslo Manual edition BOS 2023 aligns to"
    reference_period_years = 2         # CONFIRM against the BOS 2023 questionnaire
    size_threshold = 6                 # CONFIRM
    industry_scope = "CONFIRM — ANZSIC coverage of the BOS population"
    population = "CONFIRM"

    [dataset.business-innovation.source.mapping]
    # BOS CSV column -> tidy column; fill in once the export is in hand
    # "Period" = "time_period"
    # "Value" = "obs_value"

    [dataset.business-innovation.source.constants]
    # indicator = "..."   # match the OECD MEASURE code being filled
    # unit = "PT"         # percentage of enterprises
